name: Check

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'docs/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.yaml'
      - 'l10n.yaml'
      - '.github/workflows/check.yml'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze:
    name: Generated code, analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/features/trackers/data/anilist/graphql
      - name: Translations are generated from the ARB file
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
      - run: flutter analyze

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
