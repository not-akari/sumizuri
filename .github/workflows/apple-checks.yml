name: Apple checks

# Builds the iPhone app or the Mac app on a Mac of GitHub, which is the only place they can be built from here. It runs only when started by hand from the Actions page, since a Mac build is long and a push to main does not need one. Run the iPhone simulator build after a change to the iPhone code, and the device build once before a release tag, since the release builds the same way.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to build
        type: choice
        default: iphone-simulator
        options:
          - iphone-simulator
          - iphone-device
          - mac

# A newer run of the same kind stops the one before it.
concurrency:
  group: apple-checks-${{ github.ref }}
  cancel-in-progress: true

# These builds only read the repo, so the token of the run can do nothing else.
permissions:
  contents: read

jobs:
  # The Kotlin framework for the simulator of Apple silicon, and the whole app on it. It needs no signing.
  iphone-simulator:
    name: iPhone simulator
    if: ${{ inputs.what == 'iphone-simulator' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # A Mac of GitHub starts empty every run, and its cache would only fill the storage of Actions, so nothing is cached.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      # The Kotlin side alone, which shows an error in the code of the iPhone before the whole project is made.
      - name: Build the Kotlin framework
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64
      # Homebrew would update its whole list first, which takes minutes, and XcodeGen does not need the newest one.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen
      - name: Build the app for the simulator
        working-directory: iosApp
        run: |
          xcodegen
          xcodebuild -project Sumizuri.xcodeproj -scheme Sumizuri -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  # The app for a phone as the release builds it, in release mode and not signed. This is the longest build, so it is run once before a release tag and not on every change.
  iphone-device:
    name: iPhone device
    if: ${{ inputs.what == 'iphone-device' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      # The Release build of the framework studies the whole app at once, so the Mac gives it 6 of its 7 GB, as the release does.
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx6g\n' >> ~/.gradle/gradle.properties
      # Homebrew would update its whole list first, which takes minutes, and XcodeGen does not need the newest one.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen
      - name: Build the app for a phone
        working-directory: iosApp
        run: |
          xcodegen
          xcodebuild -project Sumizuri.xcodeproj -scheme Sumizuri -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Check that the app is there
        run: ls -l iosApp/build/Build/Products/Release-iphoneos/Sumizuri.app

  # The code of the desktop app is compiled, and the app folder is made as the disk image would be.
  mac:
    name: Mac app
    if: ${{ inputs.what == 'mac' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Compile and make the app folder
        run: ./gradlew :app:desktop:compileKotlin :app:desktop:createReleaseDistributable
