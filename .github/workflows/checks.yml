name: Checks

# Runs on every pull request to main and on every push to main. A pull request can be merged once both jobs pass: the repo rules, and the app building for desktop and Android. Both jobs run on the Linux machines of GitHub, which are free for a public repo. A pull request from anyone runs here, so they never run on a computer of the developer.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same pull request stops the run of the one before it. Runs on main all finish, so every merge is checked even when two land close together.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request only reads the repo, so the token of the run can do nothing else.
permissions:
  contents: read

jobs:
  rules:
    name: Repo rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Stray files, signing and file length
        run: bash scripts/check-repo.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The code must be formatted as spotlessApply leaves it, so a pull request never mixes format changes into its own.
      - name: Format
        run: ./gradlew spotlessCheck --console=plain

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The Gradle files are kept in the cache of GitHub between runs.
      - uses: gradle/actions/setup-gradle@v5
      # Only this copy of the repo is changed. The machines of GitHub have 16 GB, so the build takes 6 of them. The build cache is kept with the other Gradle files, so a part of the app that did not change comes from the last run instead of being compiled again.
      - name: Let Gradle build in parallel
        run: |
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n' >> gradle.properties
      # The Linux machines of GitHub come with the Android SDK, set in ANDROID_HOME. The desktop code is compiled, and the Android app is built in full, which also checks its resources and its manifest.
      - name: Compile desktop and build Android
        run: ./gradlew :app:desktop:compileKotlin :app:android:assembleDebug --console=plain
