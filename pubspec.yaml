name: sumizuri
description: "A from-scratch Flutter manga, novel and anime reader with source extensions, built for low-end devices."
homepage: https://not-akari.github.io/sumizuri
repository: https://github.com/not-akari/sumizuri
issue_tracker: https://github.com/not-akari/sumizuri/issues
publish_to: 'none'

version: 0.3.5

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flex_color_scheme: ^8.3.0
  google_fonts: ^6.2.1

  flutter_riverpod: ^3.1.0
  drift: ^2.35.0
  # Used directly for SqliteException in failure_mapper.dart.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  package_info_plus: ^8.1.1
  path: ^1.9.1
  riverpod_annotation: ^4.0.7
  # Custom window frame on desktop, see main.dart.
  bitsdojo_window: ^0.1.6
  flutter_js: ^0.8.7
  # HTML parsing for the JS bridge's query/select host function.
  html: ^0.15.7
  http: ^1.6.0
  # Decoder for Korean legacy pages that declare EUC-KR/CP949.
  cp949_codec: ^1.0.2
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  flutter_highlight: ^0.7.0
  # A direct dependency because the code field builds highlight.Node spans itself.
  highlight: ^0.7.0
  cookie_jar: ^4.0.9
  # Windows only: solves a Cloudflare challenge or login.
  webview_windows: ^0.4.0
  # Android/iOS equivalent of webview_windows.
  webview_flutter: ^4.10.0
  extended_image: ^10.1.0
  # Crops the avatar image the user picks
  image: ^4.9.2
  # AVIF decoding
  flutter_avif: ^3.1.0
  # Wi-Fi only gate for the auto library update check
  connectivity_plus: ^6.1.5
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.7
  local_notifier: ^0.1.6
  # Precise jump-to-index for the continuous reader viewer's lazy page list.
  super_sliver_list: ^0.4.1
  archive: ^4.3.0
  open_filex: ^4.7.0
  device_info_plus: ^12.4.0
  wakelock_plus: ^1.3.3
  workmanager: ^0.10.10

  drift_dev: any
  flutter_native_splash: any
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  pointycastle: ^4.0.0
  xpath_selector_html_parser: ^3.0.1
  flutter_local_notifications: ^22.3.1
  gql: ^1.0.1
  app_links: ^7.2.1
  flutter_chrome_cast: ^1.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4
  graphql_codegen: ^3.0.2

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true

  android:
    generate: false
  ios:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/app_icon.png
    - lib/l10n/app_en.arb
    - assets/js/json_engine_prelude.js
    - assets/js/js_stdlib.js
    - assets/changelog.md
    - docs/getting_started.md
    - docs/json_extension.md
    - docs/js_extension.md
    - docs/anime_extension.md
    - docs/repository.md

  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
        - asset: assets/fonts/OpenDyslexic-Italic.otf
          style: italic
        - asset: assets/fonts/OpenDyslexic-BoldItalic.otf
          weight: 700
          style: italic
