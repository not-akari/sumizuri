query SearchMedia(
  $search: String!
  $type: MediaType!
  $format: MediaFormat
  $formatNot: MediaFormat
  $page: Int = 1
  $perPage: Int = 20
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(
      search: $search
      type: $type
      format: $format
      format_not: $formatNot
      sort: SEARCH_MATCH
    ) {
      ...MediaCore
    }
  }
}
